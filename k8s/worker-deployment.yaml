apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-worker
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-worker
  template:
    metadata:
      labels:
        app: taskflow-worker
    spec:
      containers:
        - name: worker
          image: ourea0344/taskflow-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.rabbitmq_worker"]
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: RABBITMQ_URL
