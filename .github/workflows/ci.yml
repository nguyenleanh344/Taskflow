name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check code formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest