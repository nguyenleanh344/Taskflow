[project]
name = "taskflow-api"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "email-validator",
    "alembic",
    "passlib[bcrypt]",
    "bcrypt<5",
    "python-jose[cryptography]",
]

[tool.setuptools.packages.find]
include = ["app*"]