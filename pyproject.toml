[project]
name = "taskflow-api"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "email-validator",
    "alembic",
    "passlib[bcrypt]",
    "bcrypt<5",
    "python-jose[cryptography]",
    "redis",
    "prometheus-fastapi-instrumentator==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.15.12",
    "httpx",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
include = ["app*"]
